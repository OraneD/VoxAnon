# Configuration for select_speakers.py (UNBALANCED variant)
# Usage: python select_test_enroll_speakers.py speaker_selection_unbalanced_test.yaml
#
# Imbalance design:
#   gender      : male = half of female
#   accent      : indian = half of us / england / australia (those 3 balanced)
#   age_range   : 60+ = half of the 3 other ranges (those 3 balanced)
#   pitch: high = half of low / mid (low / mid balanced)


metadata: VoxCeleb1_speakers_metadata_verified.csv # should be in the script's folder
id_column: spk_id          

output:
  enroll: enroll_speakers_unbalanced_100_verified.csv
  trial: trial_speakers_unbalanced_50_verified.csv

# --------------------------------------------------------------------------- #
# Sizes
# --------------------------------------------------------------------------- #
n_enroll: 100
n_trial: 50

# Trial speakers are always selected among the enroll speakers.

filters:
  keep:                      # keep only rows whose value is in the list
    gender: [male, female]
    accent: [us, england, australia, indian]
    pitch_level: [low, mid, high]
  drop:                      
    age_range: [child]

weights:
  gender: 1000
  age_range: 100
  accent: 10
  pitch_level: 10

solver:
  time_limit: null           # seconds, null = no limit
  verbose: false


targets:
  enroll:
    gender:
      male: 33
      female: 67
    age_range:
      "18-24": 29
      "25-34": 28
      "35-59": 29
      "60+": 14
    accent:
      us: 28
      england: 29
      australia: 29
      indian: 14
    pitch_level:
      high: 20
      low: 40
      mid: 40

  trial:
    gender:
      male: 17
      female: 33
    age_range:
      "18-24": 14
      "25-34": 15
      "35-59": 14
      "60+": 7
    accent:
      us: 14
      england: 14
      australia: 15
      indian: 7
    pitch_level:
      high: 10
      low: 20
      mid: 20